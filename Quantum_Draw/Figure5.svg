<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%" style="background:#ffffff; font-family:sans-serif;">
  <!-- Lines -->
  <line x1="50" y1="50" x2="550" y2="50" stroke="#333" stroke-width="2" />
  <line x1="50" y1="100" x2="550" y2="100" stroke="#333" stroke-width="2" />
  <line x1="50" y1="150" x2="550" y2="150" stroke="#333" stroke-width="2" />
  
  <!-- Labels -->
  <text x="20" y="55" font-size="16" fill="#333">q₀</text>
  <text x="20" y="105" font-size="16" fill="#333">q₁</text>
  <text x="20" y="155" font-size="16" fill="#333">q₂</text>
  
  <!-- H Gate -->
  <rect x="100" y="30" width="40" height="40" fill="#e3f2fd" stroke="#0288d1" stroke-width="2" rx="4" />
  <text x="120" y="55" font-size="18" fill="#0288d1" text-anchor="middle">H</text>

  <rect x="100" y="80" width="40" height="40" fill="#e3f2fd" stroke="#0288d1" stroke-width="2" rx="4" />
  <text x="120" y="105" font-size="18" fill="#0288d1" text-anchor="middle">H</text>
  
  <!-- CNOT 1 -->
  <circle cx="200" cy="50" r="6" fill="#333" />
  <line x1="200" y1="50" x2="200" y2="100" stroke="#333" stroke-width="2" />
  <circle cx="200" cy="100" r="14" fill="none" stroke="#333" stroke-width="2" />
  <line x1="200" y1="86" x2="200" y2="114" stroke="#333" stroke-width="2" />
  <line x1="186" y1="100" x2="214" y2="100" stroke="#333" stroke-width="2" />
  
  <!-- CNOT 2 -->
  <circle cx="280" cy="100" r="6" fill="#333" />
  <line x1="280" y1="100" x2="280" y2="150" stroke="#333" stroke-width="2" />
  <circle cx="280" cy="150" r="14" fill="none" stroke="#333" stroke-width="2" />
  <line x1="280" y1="136" x2="280" y2="164" stroke="#333" stroke-width="2" />
  <line x1="266" y1="150" x2="294" y2="150" stroke="#333" stroke-width="2" />

  <!-- Rz Gate -->
  <rect x="360" y="130" width="60" height="40" fill="#f3e5f5" stroke="#512da8" stroke-width="2" rx="4" />
  <text x="390" y="155" font-size="14" fill="#512da8" text-anchor="middle">Rz(θ)</text>

  <!-- Measurement -->
  <rect x="480" y="30" width="40" height="40" fill="#e8eaf6" stroke="#4527a0" stroke-width="2" rx="4" />
  <path d="M 485 55 Q 500 35 515 55" fill="none" stroke="#4527a0" stroke-width="2" />
  <line x1="500" y1="55" x2="510" y2="40" stroke="#4527a0" stroke-width="2" />
  
  <rect x="480" y="80" width="40" height="40" fill="#e8eaf6" stroke="#4527a0" stroke-width="2" rx="4" />
  <path d="M 485 105 Q 500 85 515 105" fill="none" stroke="#4527a0" stroke-width="2" />
  <line x1="500" y1="105" x2="510" y2="90" stroke="#4527a0" stroke-width="2" />
</svg>
