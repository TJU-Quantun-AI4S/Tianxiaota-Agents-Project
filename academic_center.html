<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学术文献智能体中心</title>
    <link rel="stylesheet" crossorigin href="./assets/index-DX3kZpGl.css">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
      }
      .header-container {
        display: flex;
        align-items: center;
        padding: 0 20px;
        height: 64px;
        background: #fff;
        box-shadow: 0 2px 8px #f0f1f2;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .logo-wrapper {
        width: 180px;
        display: flex;
        align-items: center;
      }
      .logo-wrapper img {
        height: 40px;
      }
      .main-content {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .page-title {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 32px;
        text-align: center;
        color: #000000e0;
      }
      .agents-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 24px;
        justify-content: center;
      }
      .agent-card {
        background: #fff;
        border-radius: 8px;
        padding: 32px 24px;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.03), 0 1px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px 0 rgba(0, 0, 0, 0.02);
        cursor: pointer;
        transition: all 0.3s;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        border: 1px solid #f0f0f0;
      }
      .agent-card:hover {
        box-shadow: 0 6px 16px -8px rgba(0,0,0,0.08), 0 9px 28px 0 rgba(0,0,0,0.05), 0 12px 48px 16px rgba(0,0,0,0.03);
        border-color: transparent;
        transform: translateY(-2px);
      }
      .agent-icon {
        width: 80px;
        height: 80px;
        background: #f6ffed;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        font-size: 40px;
        color: #52c41a;
      }
      .agent-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #000000e0;
      }
      .agent-desc {
        color: #00000073;
        font-size: 14px;
        line-height: 1.5715;
      }
      .footer-msg {
        text-align: center;
        margin-top: 60px;
        color: #00000073;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="header-container">
      <div class="logo-wrapper">
         <a href="/">
           <img src="./AI_Draw/tju_white_padding.png" alt="Tianjin University Logo">
         </a>
      </div>
    </div>

    <div class="main-content">
      <h1 class="page-title">学术文献智能体中心</h1>
      
      <div class="agents-grid">
        <!-- Agent 1 -->
        <a href="http://deepseek.com" target="_blank" class="agent-card">
          <div class="agent-icon">
            <!-- Book/Reading icon -->
            <svg viewBox="0 0 1024 1024" width="48" height="48" fill="currentColor">
              <path d="M832 352c-17.7 0-32 14.3-32 32v416h-64V128H384v672H192V128H128v736c0 17.7 14.3 32 32 32h704c17.7 0 32-14.3 32-32V384c0-17.7-14.3-32-32-32zm-544 0h128v64H288v-64zm0 128h128v64H288v-64zm0 128h128v64H288v-64z"/>
            </svg>
          </div>
          <div class="agent-title">文献阅读智能体</div>
          <div class="agent-desc">深度解析学术文献内容</div>
        </a>
        
        <!-- Agent 2 -->
        <a href="https://tjudeep.vip.cpolar.cn/" target="_blank" class="agent-card">
          <div class="agent-icon" style="background: #e6f7ff; color: #1890ff;">
            <!-- Research/Globe icon -->
            <svg viewBox="0 0 1024 1024" width="48" height="48" fill="currentColor">
              <path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm0 820c-205.4 0-372-166.6-372-372s166.6-372 372-372 372 166.6 372 372-166.6 372-372 372zm196.4-539.5c-42.9-42.9-112.5-42.9-155.4 0l-169 169-78.2-78.2c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l100.8 100.8c6.2 6.2 14.4 9.4 22.6 9.4s16.4-3.1 22.6-9.4l191.8-191.8c12.5-12.5 12.5-32.8 0-45.3z"/>
            </svg>
          </div>
          <div class="agent-title">前沿文献调研智能体</div>
          <div class="agent-desc">追踪最新学术前沿动态</div>
        </a>
      </div>

      <div class="footer-msg">更多智能体还在开发中...</div>
    </div>

    <script>
      (function() {
        const PREFIX = 'tianxiaota.metrics.';
        const KEYS = {
          visitCount: PREFIX + 'visitCount',
          agentUseCount: PREFIX + 'agentUseCount',
          agentUseByName: PREFIX + 'agentUseByName',
          logs: PREFIX + 'logs'
        };
        const MAX_LOGS = 200;
        const safeJSONParse = (value, fallback) => {
          try {
            if (value == null || value === '') return fallback;
            return JSON.parse(value);
          } catch {
            return fallback;
          }
        };
        const safeGetItem = (key) => {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        };
        const safeSetItem = (key, value) => {
          try {
            localStorage.setItem(key, value);
            return true;
          } catch {
            return false;
          }
        };
        const safeGetNumber = (key) => {
          const raw = safeGetItem(key);
          const n = raw == null ? 0 : Number(raw);
          return Number.isFinite(n) ? n : 0;
        };
        const safeSetNumber = (key, value) => safeSetItem(key, String(value));
        const nowISO = () => new Date().toISOString();
        const loadAgentMap = () => safeJSONParse(safeGetItem(KEYS.agentUseByName), {});
        const saveAgentMap = (map) => safeSetItem(KEYS.agentUseByName, JSON.stringify(map));
        const loadLogs = () => safeJSONParse(safeGetItem(KEYS.logs), []);
        const saveLogs = (logs) => safeSetItem(KEYS.logs, JSON.stringify(logs.slice(-MAX_LOGS)));
        const pushLog = (entry) => {
          const logs = loadLogs();
          logs.push(entry);
          saveLogs(logs);
        };
        const renderBadge = () => {
          const id = 'tianxiaota-metrics-badge';
          let el = document.getElementById(id);
          if (!el) {
            el = document.createElement('div');
            el.id = id;
            Object.assign(el.style, {
              position: 'fixed',
              right: '16px',
              bottom: '16px',
              zIndex: '2147483647',
              background: 'rgba(255,255,255,0.95)',
              border: '1px solid rgba(0,0,0,0.08)',
              borderRadius: '12px',
              padding: '10px 12px',
              boxShadow: '0 6px 16px rgba(0,0,0,0.08)',
              fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif',
              fontSize: '12px',
              color: '#1f1f1f',
              lineHeight: '1.4',
              userSelect: 'none'
            });
            document.body.appendChild(el);
          }
          const visits = safeGetNumber(KEYS.visitCount);
          const uses = safeGetNumber(KEYS.agentUseCount);
          el.innerHTML = `<div style="font-weight:600; margin-bottom:2px; color:#003366;">天小塔统计</div>
<div>访问次数：<span style="font-weight:600;">${visits}</span></div>
<div>智能体使用次数：<span style="font-weight:600;">${uses}</span></div>`;
        };

        const metrics = window.__tianxiaotaMetrics || {
          recordVisit: (source) => {
            const next = safeGetNumber(KEYS.visitCount) + 1;
            safeSetNumber(KEYS.visitCount, next);
            pushLog({ type: 'visit', ts: nowISO(), path: location.pathname + location.search + location.hash, source: source || 'page' });
            renderBadge();
            return next;
          },
          recordAgentUse: (agentName, target) => {
            const next = safeGetNumber(KEYS.agentUseCount) + 1;
            safeSetNumber(KEYS.agentUseCount, next);
            const map = loadAgentMap();
            const name = agentName || 'unknown';
            map[name] = (Number(map[name]) || 0) + 1;
            saveAgentMap(map);
            pushLog({ type: 'agent_use', ts: nowISO(), agent: name, target: target || null, path: location.pathname + location.search + location.hash });
            renderBadge();
            return next;
          },
          renderBadge
        };
        window.__tianxiaotaMetrics = metrics;

        metrics.recordVisit('academic_center');
        metrics.renderBadge();

        document.querySelectorAll('.agent-card').forEach((a) => {
          a.addEventListener('click', function() {
            const title = (a.querySelector('.agent-title') && a.querySelector('.agent-title').textContent || '').trim();
            const href = a.getAttribute('href') || '';
            metrics.recordAgentUse(title || '学术文献智能体中心', href);
          }, true);
        });
      })();
    </script>
  </body>
</html>
